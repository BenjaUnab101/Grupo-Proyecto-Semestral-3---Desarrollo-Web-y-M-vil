services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://pequenos_reyes:pequenos_reyes@postgres:5432/pequenos_reyes
      MONGODB_URL: mongodb://mongo:27017
      MONGODB_DATABASE: pequenos_reyes
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pequenos_reyes
      POSTGRES_USER: pequenos_reyes
      POSTGRES_PASSWORD: pequenos_reyes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pequenos_reyes -d pequenos_reyes"]
      interval: 5s
      timeout: 5s
      retries: 10
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
volumes:
  postgres_data:
  mongo_data:
