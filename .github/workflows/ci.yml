# CI · Pequeños Reyes (Hito 3)
# Gate de integración del PR: frontend React, backend FastAPI (unitarias + seguridad) e
# integración real con Docker Compose (PostgreSQL 16 + MongoDB 7). Solo credenciales ficticias.
name: CI

on:
  pull_request:
  push:
    branches: [main, cierre-total-daniel-20261109]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · npm ci, pruebas, ESLint y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HITO-2/frontend-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HITO-2/frontend-react/package-lock.json
      - name: Instalación reproducible
        run: npm ci --no-audit --no-fund
      - name: Pruebas (node --test)
        run: npm test
      - name: ESLint (0 problemas)
        run: npx eslint . --max-warnings 0
      - name: Build de producción
        run: npm run build

  backend:
    name: Backend · pruebas unitarias y de seguridad (H-01/H-02/H-03)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HITO-3/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: HITO-3/backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: unittest discover (APP_ENV explícito)
        env:
          APP_ENV: test
        run: python -m unittest discover -v -p "tests_*.py"
      - name: La API no inicia sin APP_ENV ni con demo en producción
        run: |
          ! python -c "import app.main" 2>/dev/null
          ! APP_ENV=production PERMITIR_IDENTIDAD_DEMO=true python -c "import app.main" 2>/dev/null
          APP_ENV=production python -c "import app.main"

  integracion:
    name: Integración · Docker Compose, migraciones, seguridad y persistencia
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    defaults:
      run:
        working-directory: HITO-3/backend
    steps:
      - uses: actions/checkout@v4
      - name: Integración real (credenciales ficticias de CI)
        env:
          COMPOSE_PROJECT_NAME: pr_ci
          CI_LIMPIAR_VOLUMENES: si
        run: bash scripts/ci_integracion.sh
      - name: Logs de los servicios si algo falla
        if: failure()
        env:
          APP_ENV: development
          COMPOSE_PROJECT_NAME: pr_ci
        run: docker compose logs --no-color --tail 200
